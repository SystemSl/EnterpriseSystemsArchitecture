<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Управление гильдиями</title>
    <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div class="nav-bar">
    <a th:href="@{/players}">Игроки</a>
    <a th:href="@{/guilds}">Гильдии</a>
</div>

<h2>Список гильдий</h2>

<table>
    <thead>
    <tr>
        <th>ID</th>
        <th>Название</th>
        <th>Лидер</th>
        <th>Рейтинг</th>
        <th>Описание</th>
        <th>Дата создания</th>
        <th>Действия</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="g : ${allGuilds}">
        <td th:text="${g.id}"></td>
        <td th:text="${g.name}"></td>
        <td th:text="${g.leader.nickname}"></td>
        <td th:text="${g.rating}"></td>
        <td th:text="${g.description}"></td>
        <td th:text="${g.createdAt}"></td>
        <td>
            <a th:href="@{/guilds/edit/{id}(id=${g.id})}" class="btn btn-edit">Ред.</a>
            <a th:href="@{/guilds/delete/{id}(id=${g.id})}" class="btn btn-danger"
               onclick="return confirm('Удалить гильдию?')">Удалить</a>
        </td>
    </tr>
    </tbody>
</table>

<div class="form-box">
    <h3>Добавить / Редактировать гильдию</h3>
    <form th:action="@{/guilds/save}" th:object="${guild}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="form-row">
            <label>Название гильдии:</label>
            <input type="text" th:field="*{name}" required="required" />
        </div>

        <div class="form-row">
            <label>Лидер гильдии (игрок):</label>
            <select name="selectedLeaderId" required="required">
                <option value="">-- Выберите лидера --</option>
                <option th:each="p : ${candidateLeaders}"
                        th:value="${p.id}"
                        th:text="${p.nickname + ' (lvl ' + p.level + ')'}"
                        th:selected="${guild.leader != null and guild.leader.id == p.id}">
                </option>
            </select>
        </div>

        <div class="form-row">
            <label>Рейтинг:</label>
            <input type="number" th:field="*{rating}" />
        </div>

        <div class="form-row">
            <label>Описание:</label>
            <textarea th:field="*{description}" rows="3"></textarea>
        </div>

        <button type="submit" class="btn btn-success">Сохранить</button>
    </form>
</div>

</body>
</html>
